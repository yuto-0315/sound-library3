<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <!-- <link rel="icon" href="%PUBLIC_URL%/favicon.ico" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
    <meta name="theme-color" content="#2196F3" />
    <meta
      name="description"
      content="小学校における音楽づくりの支援教材。音の録音、管理、音楽作成機能を提供する教育用Webアプリケーション"
    />
    <meta name="keywords" content="音楽教育,小学校,音楽づくり,録音,DAW,アクセシビリティ" />
    <meta name="author" content="音楽づくり支援アプリ開発チーム" />
    
    <!-- アクセシビリティ関連のメタタグ -->
    <meta name="color-scheme" content="light" />
    
    <!-- タッチ・視覚障害者対応 -->
    <!-- <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" /> -->
    <!-- <link rel="manifest" href="%PUBLIC_URL%/manifest.json" /> -->
    
    <!-- フォーカス可視化のためのCSS -->
    <style>
      /* フォーカス可視化の基本スタイル（キーボード操作のときだけ枠を出す）。
         以前は指やマウスで押しただけでも枠が残り、選ばれていないボタンが選ばれているように見えていた。
         :focus-visible に対応していない古い Safari では下の打ち消しが無視され、常に枠が出る */
      *:focus {
        outline: 3px solid #1d4ed8;
        outline-offset: 2px;
      }

      *:focus:not(:focus-visible) {
        outline: none;
      }
      
      /* プリファースされたモーション設定の考慮 */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
    
    <title>音楽づくり支援アプリ - アクセシブル音楽教育ツール</title>
  </head>
  <body>
    <noscript>
      <div style="padding: 20px; text-align: center; font-family: sans-serif;">
        <h1>JavaScriptが無効になっています</h1>
        <p>このアプリケーションを使用するには、JavaScriptを有効にしてください。</p>
        <p>ブラウザの設定でJavaScriptを有効にする方法については、お使いのブラウザのヘルプをご確認ください。</p>
      </div>
    </noscript>
    
    <div id="root"></div>
  </body>
</html>
