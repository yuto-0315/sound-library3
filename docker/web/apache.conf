# 音楽づくり支援アプリ用の Apache の設定

# docker-compose.yml の環境変数を PHP（getenv）に渡す
PassEnv DB_HOST DB_PORT DB_NAME DB_USER DB_PASSWORD SOUND_LIBRARY_ADMIN_PIN

ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes
    AllowOverride All
</Directory>

# 共有された音のファイルへの直接アクセスは禁止（配信は api/download.php 経由）。
# ボリュームにすると api/uploads/audio/.htaccess が隠れるので、ここでも止める
<Directory /var/www/html/api/uploads>
    Require all denied
</Directory>

# 設定の例のファイルは配信しない
<FilesMatch "\.example\.php$">
    Require all denied
</FilesMatch>
