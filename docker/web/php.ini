; 共有する音は 1 ファイル 20MB まで（api/audio.php）。「先生に送る」の楽曲は音声入りの JSON なので大きめにする
upload_max_filesize = 25M
post_max_size = 120M
memory_limit = 512M
max_execution_time = 120
date.timezone = Asia/Tokyo
; エラーの中身は画面に出さず、docker compose logs で見られるようにする
display_errors = Off
log_errors = On
error_log = /dev/stderr
expose_php = Off
